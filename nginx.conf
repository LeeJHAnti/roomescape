server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/javascript text/html application/octet-stream;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|pck|js|png)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
